name: 发布 Seiya 标准构建输入

on:
  push:
    tags:
      - v1.0.0-rc.27-seiya.2
  workflow_dispatch:
    inputs:
      tag:
        description: 必须已存在且精确指向发布提交的 tag
        required: true
        default: v1.0.0-rc.27-seiya.2
      commit:
        description: 独立验收锁定的 40 位完整 commit
        required: true
      publish:
        description: 仅在 Action 制品逐字节通过独立验收后发布
        required: true
        type: boolean
        default: false
      expected_manifest_sha256:
        description: 独立验收通过的 new-api release.json SHA256
        required: false
        default: ''

concurrency:
  group: seiya-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: v1.0.0-rc.27-seiya.2
  GO_VERSION: 1.25.1
  BUN_VERSION: 1.4.0

jobs:
  guard:
    name: 锁定发布提交并执行质量门禁
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      release_commit: ${{ steps.lock.outputs.release_commit }}
    steps:
      - name: 校验精确发布 tag
        env:
          SELECTED_TAG: ${{ inputs.tag || github.ref_name }}
          SELECTED_COMMIT: ${{ inputs.commit || github.sha }}
        run: |
          set -euo pipefail
          test "$SELECTED_TAG" = "$RELEASE_TAG"
          [[ "$SELECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
      - name: 检出精确发布 tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: 锁定本次运行的发布 commit
        id: lock
        env:
          EVENT_COMMIT: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          SELECTED_COMMIT: ${{ inputs.commit || github.sha }}
        run: |
          set -euo pipefail
          release_commit=$(git rev-parse HEAD)
          tag_commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          [[ "$release_commit" =~ ^[0-9a-f]{40}$ ]]
          test "$release_commit" = "$SELECTED_COMMIT"
          test "$tag_commit" = "$release_commit"
          if [ "$EVENT_NAME" = push ]; then
            test "$EVENT_COMMIT" = "$release_commit"
          fi
          printf 'release_commit=%s\n' "$release_commit" >> "$GITHUB_OUTPUT"
      - name: 安装 Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: 校验发布脚本
        env:
          SEIYA_RELEASE_COMMIT: ${{ steps.lock.outputs.release_commit }}
        run: |
          .github/scripts/test-seiya-release.sh
          .github/scripts/seiya-release.sh verify-identity

  build:
    name: 标准构建与本地校验
    needs: guard
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      SEIYA_RELEASE_COMMIT: ${{ needs.guard.outputs.release_commit }}
    steps:
      - name: 检出本次运行锁定的 commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.guard.outputs.release_commit }}
          fetch-depth: 0
      - name: 安装 Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: 安装 Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: 构建双架构制品与 release.json
        run: .github/scripts/seiya-release.sh build dist
      - name: 上传构建结果
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seiya-new-api-v1.0.0-rc.27-seiya.2
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: 发布 sources 并逐字节回读
    needs: [guard, build]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      SEIYA_RELEASE_COMMIT: ${{ needs.guard.outputs.release_commit }}
    steps:
      - name: 检出本次运行锁定的 commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.guard.outputs.release_commit }}
          fetch-depth: 0
      - name: 安装 source 枚举使用的 Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: 下载构建结果
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: seiya-new-api-v1.0.0-rc.27-seiya.2
          path: dist/
      - name: 校验独立验收锁定的 manifest 摘要
        env:
          EXPECTED_MANIFEST: ${{ inputs.expected_manifest_sha256 }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_MANIFEST" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum dist/new-api/release.json | awk '{print $1}')" = "$EXPECTED_MANIFEST"
      - name: 安装固定版本 Fery
        run: .github/scripts/seiya-release.sh install-fery "$GITHUB_WORKSPACE/.git/fery"
      - name: 发布前重验 tag 未移动
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          .github/scripts/seiya-release.sh verify-identity
      - name: 上传 sources payload，回读后最后发布 manifest
        env:
          FERY_SECRET_KEY: ${{ secrets.FERY_SECRET_KEY }}
        run: .github/scripts/seiya-release.sh publish dist "$GITHUB_WORKSPACE/.git/fery"
